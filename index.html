<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contrato de Relator &middot; INASEP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.5/signature_pad.umd.min.js"></script>
<style>
  :root {
    /* Colores extra&iacute;dos del logo INASEP */
    --verde: #172D1A; --verde-md: #24442A; --verde-lt: #EAF0EA;
    --dorado: #E1C83A; --dorado-dk: #A88F12; --dorado-lt: #FBF6DC;
    --blanco: #FFFFFF; --fondo: #F4F5F2; --txt: #1F2A21; --txt-sm: #566057;
    --brd: #D3DAD4; --rojo: #B03030;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--fondo);color:var(--txt);line-height:1.6;font-size:16px;padding-bottom:3rem;}
  header{background:var(--verde);color:var(--blanco);padding:1.3rem 1.2rem 1.3rem;position:relative;}
  header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--dorado);}
  .hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:1rem;}
  .hd img{height:68px;width:auto;flex-shrink:0;background:#fff;border-radius:10px;padding:5px 8px;}
  header h1{font-family:'Playfair Display',serif;font-size:1.3rem;line-height:1.25;}
  header p{font-size:.8rem;opacity:.8;margin-top:.25rem;color:var(--dorado);}
  .container{max-width:720px;margin:0 auto;padding:1.5rem 1.1rem;}
  .panel{background:var(--blanco);border:1px solid var(--brd);border-radius:14px;padding:1.4rem;margin-bottom:1.2rem;box-shadow:0 2px 10px rgba(23,45,26,.06);}

  .hoja{border:1px solid var(--brd);border-top:4px solid var(--verde);border-radius:6px;padding:1.5rem 1.4rem;background:#fff;}
  .hoja .logo-wrap{text-align:center;margin-bottom:.6rem;}
  .hoja .logo{height:70px;width:auto;}
  .hoja .tit{font-family:'Playfair Display',serif;font-weight:700;font-size:1.08rem;color:var(--verde);text-align:center;text-transform:uppercase;letter-spacing:.02em;}
  .hoja .reg{width:70px;height:3px;background:var(--dorado);margin:.55rem auto .4rem;}
  .hoja .sub{font-weight:500;font-size:.8rem;text-align:center;color:var(--txt-sm);}
  .hoja .cuerpo{font-size:.86rem;margin-top:1.1rem;line-height:1.7;}
  .hoja .cuerpo p{margin-bottom:.75rem;text-align:justify;}
  .hoja .cuerpo .cl{font-weight:700;color:var(--verde);margin-bottom:.1rem;}
  .tok{background:var(--dorado-lt);border-bottom:1.5px solid var(--dorado-dk);padding:0 2px;font-weight:700;color:var(--verde);border-radius:2px;}
  .tok.vacio{color:#9a7f10;font-style:italic;font-weight:500;}

  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.6rem;text-align:center;font-size:.78rem;}
  .firmas .l{border-top:1px solid #333;padding-top:.3rem;margin-top:.2rem;line-height:1.35;}
  .firmas .sig{height:96px;display:flex;align-items:flex-end;justify-content:center;}
  .firmas .sig img{max-height:92px;max-width:100%;}
  .firmas b{color:var(--verde);}

  fieldset{border:none;margin-top:1.2rem;}
  legend{font-family:'Playfair Display',serif;color:var(--verde);font-size:1.05rem;margin-bottom:.5rem;padding-bottom:.25rem;border-bottom:2px solid var(--dorado);width:100%;}
  label.f{display:block;font-size:.8rem;font-weight:600;color:var(--txt-sm);margin-bottom:.25rem;margin-top:.8rem;}
  input[type=text],select{width:100%;padding:.75rem .85rem;border:1px solid var(--brd);border-radius:8px;font-size:.98rem;font-family:inherit;background:var(--fondo);color:var(--txt);}
  input[type=text]:focus,select:focus{outline:2px solid var(--dorado);border-color:var(--dorado);}
  .fecha-row{display:grid;grid-template-columns:90px 1fr 100px;gap:.6rem;}
  .fecha-row label{margin-top:.8rem;}
  .hint{font-size:.74rem;color:var(--rojo);margin-top:.25rem;min-height:1em;}

  .check-row{display:flex;align-items:flex-start;gap:.7rem;margin-top:1.2rem;padding:.9rem;background:var(--dorado-lt);border:1px solid #e6d98c;border-radius:10px;cursor:pointer;}
  .check-row input{width:22px;height:22px;flex-shrink:0;margin-top:.1rem;accent-color:var(--verde);}
  .check-row span{font-size:.84rem;line-height:1.5;}

  .firma-wrap{margin-top:1rem;}
  .firma-wrap > label{display:block;font-size:.8rem;font-weight:600;color:var(--txt-sm);margin-bottom:.35rem;}
  .firma-lienzo{width:100%;height:200px;border:2px dashed var(--brd);border-radius:10px;background:#fff;touch-action:none;display:block;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .firma-lienzo.tiene-firma{border-style:solid;border-color:var(--verde);}
  .firma-botones{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;}
  .firma-botones span{font-size:.75rem;color:var(--txt-sm);}
  .btn-limpiar{background:none;border:1px solid var(--brd);color:var(--txt-sm);font-size:.8rem;padding:.35rem .8rem;border-radius:6px;cursor:pointer;}
  .btn-limpiar:hover{border-color:var(--rojo);color:var(--rojo);}

  .btn-firmar{width:100%;background:var(--verde);color:var(--dorado);border:none;padding:1rem;border-radius:10px;font-size:1.02rem;font-weight:700;margin-top:1.4rem;cursor:pointer;transition:.15s;border-bottom:4px solid var(--dorado);}
  .btn-firmar:hover:not(:disabled){background:var(--verde-md);}
  .btn-firmar:disabled{background:#a9b3a9;color:#fff;border-bottom-color:#c9d0c9;cursor:not-allowed;}

  .exito{display:none;background:var(--verde-lt);border:1px solid #b5ceba;border-radius:12px;padding:1.3rem;text-align:center;margin-top:1rem;}
  .exito.on{display:block;}
  .exito .ic{font-size:2rem;}
  .exito h3{color:var(--verde);font-family:'Playfair Display',serif;margin:.4rem 0;}
  .exito p{font-size:.85rem;color:var(--txt-sm);}
  .btn-desc{display:inline-block;background:var(--dorado);color:var(--verde);text-decoration:none;font-weight:700;padding:.75rem 1.5rem;border-radius:8px;margin-top:.9rem;font-size:.92rem;}
  .aviso{margin-top:1rem;padding:.8rem .9rem;background:var(--dorado-lt);border:1px solid #e6d98c;border-radius:10px;font-size:.88rem;line-height:1.5;color:var(--txt);text-align:left;}
  .aviso a{color:var(--verde);font-weight:700;word-break:break-all;}
  .btn-volver{background:none;border:none;color:var(--txt-sm);font-size:.82rem;cursor:pointer;margin-top:1rem;text-decoration:underline;}
</style>
</head>
<body>

<header>
  <div class="hd">
    <img id="hdLogo" alt="INASEP"/>
    <div>
      <h1>Contrato de Prestaci&oacute;n de Servicios &mdash; Relatores</h1>
      <p>INASEP &middot; Completa tus datos, firma con el dedo y descarga tu contrato en PDF</p>
    </div>
  </div>
</header>

<div class="container">
  <div class="panel" id="panelFirma"></div>
</div>

/* ---- utilidades para mostrar los valores de CONFIG (no editar) ---- */
function enLetras(n){
  n = Math.floor(n);
  if (n === 0) return 'cero';
  const U = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function menor1000(x, apocope){
    if (x === 100) return 'cien';
    const c = Math.floor(x/100), r = x % 100, out = [];
    if (c) out.push(C[c]);
    if (r){
      if (r < 30){ let w = U[r]; if (apocope && r === 1) w = 'un'; else if (apocope && r === 21) w = 'veintiún'; out.push(w); }
      else { const d = Math.floor(r/10), u = r % 10; out.push(u ? D[d] + ' y ' + (apocope && u === 1 ? 'un' : U[u]) : D[d]); }
    }
    return out.join(' ');
  }
  const miles = Math.floor(n/1000), resto = n % 1000, partes = [];
  if (miles){
    if (miles >= 1000000) return String(n);
    partes.push(miles === 1 ? 'mil' : menor1000(miles, true) + ' mil');
  }
  if (resto) partes.push(menor1000(resto, false));
  return partes.join(' ');
}

function fmtPct(p){ return String(p).replace('.', ','); }

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function limpiar(s){ return (s||'').replace(/\s+/g,' ').trim(); }

/* Valida RUT chileno (m&oacute;dulo 11) */
function rutValido(r){
  const t = (r||'').replace(/[^0-9kK]/g,'').toUpperCase();
  if (t.length < 7) return false;
  const cuerpo = t.slice(0,-1), dv = t.slice(-1);
  let suma = 0, m = 2;
  for (let i = cuerpo.length-1; i >= 0; i--){ suma += parseInt(cuerpo[i],10)*m; m = m===7 ? 2 : m+1; }
  const res = 11 - (suma % 11);
  const esp = res===11 ? '0' : res===10 ? 'K' : String(res);
  return dv === esp;
}

/* ---- Texto -> segmentos [{t, b}] (HTML y PDF comparten la misma fuente) ---- */
function segmentos(plantilla, plano){
  const out = [];
  const partes = plantilla.split(/(\*\*[^*]+\*\*|\{\{\w+\}\})/);
  partes.forEach(p => {
    if (!p) return;
    if (p.startsWith('**')) out.push({ t: p.slice(2,-2), b: true });
    else if (p.startsWith('{{')){
      const k = p.slice(2,-2);
      const v = limpiar(valores[k]);
      out.push({ t: v || (plano ? '____________________' : ''), b: true, campo: k, vacio: !v });
    } else out.push({ t: p, b: false });
  });
  return out;
}
function aHtml(plantilla){
  return segmentos(plantilla, false).map(s => {
    if (s.campo) return s.vacio ? '<span class="tok vacio">[' + (ETIQ[s.campo]||s.campo).toLowerCase() + ']</span>' : '<span class="tok">' + escapeHtml(s.t) + '</span>';
    return s.b ? '<b>' + escapeHtml(s.t) + '</b>' : escapeHtml(s.t);
  }).join('');
}

let trazoHecho=false, lienzo, signaturePad, resizeHandler=null;
function configurarLienzo(){
  lienzo = document.getElementById('lienzo');
  ajustarLienzo();
  signaturePad = new SignaturePad(lienzo, { minWidth:1.1, maxWidth:2.6, penColor:'#1537B8', backgroundColor:'rgba(255,255,255,0)' });
  trazoHecho = false;
  signaturePad.addEventListener('beginStroke', () => { trazoHecho = true; lienzo.classList.add('tiene-firma'); actualizarBoton(); });
  signaturePad.addEventListener('endStroke', pintarPrevia);
  if (resizeHandler) window.removeEventListener('resize', resizeHandler);
  resizeHandler = () => {
    if (!lienzo || !document.body.contains(lienzo)) return;
    const datos = signaturePad.toData(), hubo = trazoHecho;
    ajustarLienzo(); signaturePad.clear();
    if (hubo && datos && datos.length) signaturePad.fromData(datos);
  };
  window.addEventListener('resize', resizeHandler);
}
function ajustarLienzo(){
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const ancho = Math.max(lienzo.parentElement.getBoundingClientRect().width, 1);
  lienzo.width = ancho*ratio; lienzo.height = 200*ratio;
  lienzo.style.width = ancho+'px'; lienzo.style.height = '200px';
  lienzo.getContext('2d').scale(ratio, ratio);
}
/* Recorta la firma al área realmente dibujada (así se ve grande en el PDF y en la vista previa) */
function firmaRecortada(){
  const src = lienzo, ctx = src.getContext('2d');
  const W = src.width, H = src.height, d = ctx.getImageData(0,0,W,H).data;
  let x0=W, y0=H, x1=-1, y1=-1;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    if (d[(y*W+x)*4+3] > 10){ if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y; }
  }
  if (x1 < 0) return { url: signaturePad.toDataURL('image/png'), w: W, h: H };
  const pad = 6; x0=Math.max(x0-pad,0); y0=Math.max(y0-pad,0); x1=Math.min(x1+pad,W-1); y1=Math.min(y1+pad,H-1);
  const w = x1-x0+1, h = y1-y0+1, c = document.createElement('canvas');
  c.width = w; c.height = h; c.getContext('2d').drawImage(src, x0, y0, w, h, 0, 0, w, h);
  return { url: c.toDataURL('image/png'), w, h };
}
function pintarPrevia(){
  const s = document.getElementById('sigPrev');
  if (s && !signaturePad.isEmpty()) s.innerHTML = '<img src="'+firmaRecortada().url+'" alt=""/>';
}
function limpiarFirma(){
  signaturePad.clear(); trazoHecho = false; lienzo.classList.remove('tiene-firma');
  document.getElementById('sigPrev').innerHTML = '';
  actualizarBoton();
}

function fechaValida(){
  const d = parseInt(valores.dia,10), a = parseInt(valores.anio,10), m = MESES.indexOf(valores.mes);
  if (!(d>=1 && d<=31) || m<0 || !(a>=2024 && a<=2100)) return false;
  const t = new Date(a, m, d);
  return t.getMonth() === m && t.getDate() === d;
}
function actualizarBoton(){
  const ok = limpiar(valores.nombre).split(' ').length >= 2 && limpiar(valores.nombre).length > 5
          && rutValido(valores.rut)
          && limpiar(valores.direccion).length > 4

  document.getElementById('btnFirmar').disabled = !(ok && document.getElementById('checkDecl').checked && trazoHecho);

/* ---------- Generaci&oacute;n del PDF ---------- */
const VERDE = [23,45,26], DORADO = [225,200,58], DORADO_DK = [168,143,18], GRIS = [110,118,111];

async function firmarYGenerarPDF(){
  const { jsPDF } = window.jspdf;
  const W = 216, H = 330;                       // Oficio
  const pdf = new jsPDF({ unit:'mm', format:[W,H] });
  pdf.setProperties({ title: doc.titulo + ' - ' + limpiar(valores.nombre), author: 'INASEP', subject: 'Contrato de prestación de servicios a honorarios' });
  const mL = 22, mR = 20, ancho = W - mL - mR;
  const yTop = 42, yBot = H - 25;
  let y = yTop, pagina = 1;
  let FS = 10.5, LH = 5.1;

  // logo con proporci&oacute;n real
  const imgLogo = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = LOGO; });
  const logoH = 22, logoW = logoH * imgLogo.width / imgLogo.height;

  function cabecera(){
    pdf.addImage(LOGO, 'PNG', mL, 12, logoW, logoH);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(...VERDE);
    pdf.text('INSTITUTO NACIONAL DE SEGURIDAD PRIVADA SpA', W - mR, 19, { align:'right' });
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(...GRIS);
    pdf.text('RUT ' + INASEP.rut, W - mR, 24, { align:'right' });
    pdf.text(INASEP.dom + ', ' + INASEP.comuna, W - mR, 28, { align:'right' });
    pdf.setFillColor(...VERDE);  pdf.rect(mL, 36, ancho, 1.4, 'F');
    pdf.setFillColor(...DORADO); pdf.rect(mL, 37.4, ancho, 0.7, 'F');
  }
  function nuevaPagina(){ pdf.addPage(); pagina++; cabecera(); y = yTop; }
  function espacio(alto){ /* una sola pagina: el ajuste de tamano garantiza que cabe */ }

  // ---- p&aacute;rrafo justificado con negritas ----
  function palabras(segs){
    const out = []; let cur = [];
    segs.forEach(s => s.t.split(/(\s+)/).forEach(tok => {
      if (tok === '') return;
      if (/^\s+$/.test(tok)){ if (cur.length){ out.push(cur); cur = []; } }
      else cur.push({ t: tok, b: s.b });
    }));
    if (cur.length) out.push(cur);
    return out;
  }
  function medir(run){ pdf.setFont('helvetica', run.b ? 'bold' : 'normal'); pdf.setFontSize(FS); return pdf.getTextWidth(run.t); }
  function anchoPalabra(w){ return w.reduce((a,r) => a + medir(r), 0); }
  function lineas(segs){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(FS);
    const sp = pdf.getTextWidth(' ');
    const ws = palabras(segs).map(w => ({ runs: w, w: anchoPalabra(w) }));
    const res = []; let linea = [], acum = 0;
    ws.forEach(w => {
      const nuevo = linea.length ? acum + sp + w.w : w.w;
      if (nuevo > ancho && linea.length){ res.push({ ws: linea, ancho: acum }); linea = [w]; acum = w.w; }
      else { linea.push(w); acum = nuevo; }
    });
    if (linea.length) res.push({ ws: linea, ancho: acum, ultima: true });
    return { res, sp };
  }
  function parrafo(segs, gap, opts){
    opts = opts || {};
    const { res, sp } = lineas(segs);
    res.forEach((ln, idx) => {
      espacio(LH + (idx === 0 && opts.mantener ? opts.mantener : 0));
      const gaps = ln.ws.length - 1;
      const sepa = (!ln.ultima && gaps > 0) ? (ancho - (ln.ancho - gaps*sp)) / gaps : sp;
      let x = mL;
      ln.ws.forEach(w => {
        w.runs.forEach(r => {
          pdf.setFont('helvetica', r.b ? 'bold' : 'normal'); pdf.setFontSize(FS); pdf.setTextColor(25,30,26);
          pdf.text(r.t, x, y); x += pdf.getTextWidth(r.t);
        });
        x += sepa;
      });
      y += LH;
    });
    y += gap;
  }

  // ---- ajuste automatico: todo el contrato debe caber en UNA sola pagina ----
  const ALTO_FIRMAS = 66, ALTO_TIT = 23.5;
  function alturaTotal(){
    let h = ALTO_TIT;
    h += lineas(segmentos(doc.intro, true)).res.length * LH + 4.2;
    doc.clausulas.forEach(c => { h += LH + 0.4 + lineas(segmentos(c[1], true)).res.length * LH + 3.6; });
    return h + ALTO_FIRMAS;
  }
  for (let f = 10.5; f >= 7.5; f -= 0.1){
    FS = f; LH = f * 0.485;
    if (alturaTotal() <= (yBot - yTop)) break;
  }

  // ---- encabezado ----
  cabecera();
  pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(...VERDE);
  pdf.text(doc.titulo, W/2, y + 2, { align:'center' }); y += 8;
  pdf.setFillColor(...DORADO); pdf.rect(W/2 - 14, y, 28, 0.9, 'F'); y += 5.5;
  pdf.setFont('helvetica','italic'); pdf.setFontSize(9.5); pdf.setTextColor(...GRIS);
  pdf.text('(' + doc.subtitulo + ')', W/2, y, { align:'center' }); y += 9;

  // ---- cuerpo ----
  parrafo(segmentos(doc.intro, true), 4.2);
  doc.clausulas.forEach(c => {
    espacio(LH*3 + 2);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(FS); pdf.setTextColor(...VERDE);
    pdf.text(c[0], mL, y); y += LH + 0.4;
    parrafo(segmentos(c[1], true), 3.6, { mantener: LH });
  });

  // ---- firmas ----
  y += 4;
  const colW = 78, xA = mL, xB = W - mR - colW;
  const yFirma = y + 36;
  // INASEP (firma fija de la Representante Legal, grande)
  const imgF = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = FIRMA_DIRECTORA; });
  let fh = 34, fw = fh * imgF.width / imgF.height; if (fw > colW - 2){ fw = colW - 2; fh = fw * imgF.height / imgF.width; }
  pdf.addImage(FIRMA_DIRECTORA, 'PNG', xA + (colW - fw)/2, yFirma - fh - 0.5, fw, fh);
  // Prestador (firma dibujada)
  const fr = firmaRecortada(), firmaImg = fr.url;
  let ph = 34, pw = ph * fr.w / fr.h; if (pw > colW - 2){ pw = colW - 2; ph = pw * fr.h / fr.w; }
  pdf.addImage(firmaImg, 'PNG', xB + (colW - pw)/2, yFirma - ph - 0.5, pw, ph);

  pdf.setDrawColor(...VERDE); pdf.setLineWidth(0.4);
  pdf.line(xA, yFirma, xA + colW, yFirma); pdf.line(xB, yFirma, xB + colW, yFirma);

  function bloque(x, l1, l2, l3, l4){
    pdf.setTextColor(...VERDE); pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5);
    const nom = pdf.splitTextToSize(l1, colW);
    pdf.text(nom, x + colW/2, yFirma + 5, { align:'center' });
    let yy = yFirma + 5 + (nom.length - 1)*4.2;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(40,46,41);
    pdf.text(l2, x + colW/2, yy + 4.4, { align:'center' });
    pdf.text(l3, x + colW/2, yy + 8.8, { align:'center' });
    if (l4) pdf.text(l4, x + colW/2, yy + 13.2, { align:'center' });
  }
  bloque(xA, INASEP.rep, 'RUT ' + INASEP.repRut, INASEP.repCargo, 'INASEP');
  bloque(xB, limpiar(valores.nombre), 'RUT ' + valores.rut, 'El Prestador', '');

  // ---- pie en todas las p&aacute;ginas ----
  const total = pdf.getNumberOfPages();
  for (let i = 1; i <= total; i++){
    pdf.setPage(i);
    pdf.setDrawColor(...DORADO); pdf.setLineWidth(0.6); pdf.line(mL, H - 20, W - mR, H - 20);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(...GRIS);
    pdf.text('Instituto Nacional de Seguridad Privada SpA  ·  RUT ' + INASEP.rut + '  ·  ' + INASEP.dom + ', ' + INASEP.comuna, mL, H - 14.5);
    pdf.text('Página ' + i + ' de ' + total, W - mR, H - 14.5, { align:'right' });
  }

  const nombreArchivo = 'Contrato_Relator_INASEP_' + (valores.rut||'').replace(/[.\-]/g,'') + '.pdf';
  const url = URL.createObjectURL(pdf.output('blob'));
  const a = document.getElementById('btnDescargar'); a.href = url; a.download = nombreArchivo;
  const asunto = 'Contrato Relator INASEP - ' + limpiar(valores.nombre) + ' - RUT ' + valores.rut;
  document.getElementById('btnCorreo').href = 'mailto:instituto@inasep.cl?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent('Junto con saludar, adjunto copia de mi contrato de prestación de servicios firmado.\n\n' + limpiar(valores.nombre) + '\nRUT ' + valores.rut);
  document.getElementById('exito').classList.add('on');
  document.getElementById('exito').scrollIntoView({ behavior:'smooth', block:'center' });
  document.getElementById('btnFirmar').style.display = 'none';
}

render();
</script>
